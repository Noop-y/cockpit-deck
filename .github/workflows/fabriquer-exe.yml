name: Fabriquer The Deck pour Windows

on:
  push:
  workflow_dispatch:

jobs:
  # Programme de l'écran (ESP32-P4) : deux versions, pour les puces v3 (récentes) et v1.x (premières cartes)
  ecran:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rev: [rev3, rev1]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Fabriquer le programme de l'écran (${{ matrix.rev }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          path: firmware
          command: |
            export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.${{ matrix.rev }}"
            idf.py -B build-${{ matrix.rev }} -D SDKCONFIG=build-${{ matrix.rev }}/sdkconfig set-target esp32p4 build
            idf.py -B build-${{ matrix.rev }} -D SDKCONFIG=build-${{ matrix.rev }}/sdkconfig merge-bin -o ecran-${{ matrix.rev }}.bin

      - name: Ranger le fichier
        run: |
          mkdir -p out
          sudo cp firmware/build-${{ matrix.rev }}/ecran-${{ matrix.rev }}.bin out/
          sudo cp firmware/build-${{ matrix.rev }}/the-deck-ecran.bin out/app-${{ matrix.rev }}.bin
          ls -la out

      - name: Mettre le programme de l'écran à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: ecran-${{ matrix.rev }}
          path: |
            out/ecran-${{ matrix.rev }}.bin
            out/app-${{ matrix.rev }}.bin
          if-no-files-found: error

  windows:
    needs: ecran
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils
        run: npm install

      - name: Récupérer FFmpeg (enregistreur de clips)
        shell: pwsh
        run: |
          $u = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force vendor | Out-Null
          $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName vendor/ffmpeg.exe
          $lic = Get-ChildItem ffmpeg-tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName vendor/FFMPEG-LICENCE.txt } else { 'FFmpeg - GPL v3 - https://ffmpeg.org' | Out-File vendor/FFMPEG-LICENCE.txt }
          $f = (& vendor/ffmpeg.exe -hide_banner -filters 2>&1) -join "`n"
          $e = (& vendor/ffmpeg.exe -hide_banner -encoders 2>&1) -join "`n"
          $has = @('gfxcapture','ddagrab','h264_nvenc','h264_amf','h264_qsv') | ForEach-Object { "$_=" + ([bool](($f + $e) -match "\b$_\b")) }
          Write-Output "::notice title=FFmpeg::$($has -join ' ')"

      - name: Ajouter le programme de l'écran au logiciel
        uses: actions/download-artifact@v4
        with:
          pattern: ecran-*
          path: src/firmware
          merge-multiple: true

      - name: Fiche du programme de l'écran et outil d'installation (esptool-js)
        shell: pwsh
        run: |
          $v = (Get-Content firmware/version.txt -TotalCount 1).Trim()
          $files = @{}
          foreach ($r in 'rev3', 'rev1') { $f = Get-Item "src/firmware/ecran-$r.bin"; $a = Get-Item "src/firmware/app-$r.bin"; $files[$r] = @{ file = $f.Name; size = $f.Length; app = $a.Name; appSize = $a.Length } }
          @{ version = $v; build = $env:GITHUB_SHA.Substring(0, 7); files = $files } | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 src/firmware/ecran.json
          Get-Content src/firmware/ecran.json
          npm install --no-save esptool-js@latest esbuild@0.25.0
          New-Item -ItemType Directory -Force src/vendor | Out-Null
          npx esbuild node_modules/esptool-js/lib/index.js --bundle --format=iife --global-name=esptooljs --platform=browser --minify --outfile=src/vendor/esptool.js
          Get-Item src/vendor/esptool.js

      - name: Fabriquer les fichiers .exe
        run: npm run dist

      - name: Mettre les .exe à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: The-Deck-Windows
          path: dist/*.exe
          if-no-files-found: error
